# Auto-Deploy der Azure Functions zum App Service `skillgapper-api`.
#
# Triggert nur wenn azure-functions/** sich geändert hat → Frontend-Edits
# blockieren den Functions-Deploy nicht.
#
# Authentifizierung via Publish-Profile (XML aus dem Azure-Portal). Liegt
# als Repo-Secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE.
# Setzen:
#   az functionapp deployment list-publishing-profiles \
#       --name skillgapper-api --resource-group Creation --xml \
#       | gh secret set AZURE_FUNCTIONAPP_PUBLISH_PROFILE
name: Deploy Azure Functions

on:
  push:
    branches: [main, develop]
    paths:
      - 'azure-functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: # Manueller Trigger aus dem Actions-Tab

env:
  AZURE_FUNCTIONAPP_NAME:         skillgapper-api
  AZURE_FUNCTIONAPP_PACKAGE_PATH: azure-functions
  NODE_VERSION:                   '22.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/package-lock.json

      - name: Install dependencies (production-only)
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: npm ci --omit=dev

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name:        ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package:         ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
